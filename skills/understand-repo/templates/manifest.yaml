edru_run:
  schema_version: "2.0"
  run_id: "EDRU-YYYYMMDD-HHMMSS"
  operation: "create" # create | update
  parent_run_id: "" # required and non-empty for update
  status: "in_progress" # in_progress | blocked | completed | completed_with_unknowns
  mode: "takeover" # survey | takeover | change-ready
  started_at: ""
  completed_at: ""

  repository:
    path_or_url: ""
    revision: ""
    branch: ""
    dirty_worktree: null
    working_tree_fingerprint: ""
    submodules: []
    lfs_enabled: null

  objective: ""
  change_target: ""

  scope:
    included: []
    excluded: []
    assumptions: []

  environment:
    platform: ""
    build_variant: ""
    feature_flags: []
    runtime_access: false
    network_access: false
    isolation: ""
    tool_versions: {}

  budget:
    max_elapsed_minutes: null
    max_files_full_read: null
    max_critical_paths: 3
    max_dynamic_scenarios: 0

  asset_root: ".edru"
  history_root: "history" # relative to asset_root
  critical_paths: []
  blocking_unknowns: []

  # For operation: update, use templates/update-manifest.yaml instead.
